<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Prank Call Queue</title>
  <style>
    body {
      background: #0d0d14;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      text-align: center;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .controls {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .controls input {
      font-size: 1.5rem;
      padding: 8px 12px;
      min-width: 260px;
      border-radius: 6px;
      border: none;
      outline: none;
    }

    .controls button {
      font-size: 1.5rem;
      padding: 8px 18px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background: #1e3a8a;
      color: #fff;
      transition: 0.2s;
    }

    .controls button:hover {
      background: #274bbd;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      width: 100%;
      max-width: 800px;
    }

    li {
      font-size: 2.5rem;
      padding: 15px 20px;
      margin-bottom: 12px;
      background: #1e3a8a; /* dark blue background */
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }

    .name {
      flex: 1;
      margin-right: 10px;
      outline: none;
    }

    .item-buttons button {
      font-size: 1.3rem;
      margin-left: 6px;
      padding: 5px 10px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background: #0f172a;
      color: #fff;
      transition: 0.2s;
    }

    .item-buttons button:hover {
      background: #1e293b;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2.2rem;
      }
      li {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <h1>Prank Call Queue</h1>

  <div class="controls">
    <input id="nameInput" type="text" placeholder="Enter name..." />
    <button onclick="addName()">Add</button>
    <button onclick="clearList()">Clear All</button>
  </div>

  <ul id="queueList"></ul>

  <script>
    const nameInput = document.getElementById('nameInput');
    const queueList = document.getElementById('queueList');

    function addName() {
      const name = nameInput.value.trim();
      if (!name) return;
      const li = createListItem(name);
      queueList.appendChild(li);
      nameInput.value = '';
      nameInput.focus();
    }

    function clearList() {
      if (confirm('Clear the entire list?')) {
        queueList.innerHTML = '';
      }
    }

    function createListItem(nameText) {
      const li = document.createElement('li');

      const span = document.createElement('span');
      span.className = 'name';
      span.textContent = nameText;
      span.contentEditable = 'true';

      const buttonsDiv = document.createElement('div');
      buttonsDiv.className = 'item-buttons';

      const upBtn = document.createElement('button');
      upBtn.textContent = '↑';
      upBtn.title = 'Move up';
      upBtn.onclick = () => moveItem(li, -1);

      const downBtn = document.createElement('button');
      downBtn.textContent = '↓';
      downBtn.title = 'Move down';
      downBtn.onclick = () => moveItem(li, 1);

      const removeBtn = document.createElement('button');
      removeBtn.textContent = '✕';
      removeBtn.title = 'Remove';
      removeBtn.onclick = () => li.remove();

      buttonsDiv.appendChild(upBtn);
      buttonsDiv.appendChild(downBtn);
      buttonsDiv.appendChild(removeBtn);

      li.appendChild(span);
      li.appendChild(buttonsDiv);

      return li;
    }

    function moveItem(li, direction) {
      const sibling = direction === -1 ? li.previousElementSibling : li.nextElementSibling;
      if (!sibling) return;
      if (direction === -1) {
        queueList.insertBefore(li, sibling);
      } else {
        queueList.insertBefore(sibling, li);
      }
    }

    nameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        addName();
      }
    });
  </script>
</body>
</html>
